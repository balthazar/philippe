<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preloaded so the self-hosted faces are already in cache before the
         CSS that references them is parsed, avoiding a fallback-then-swap
         flash. Only the "latin" subset: French and English text stays inside
         U+0000-00FF/U+0152-0153, which that subset alone covers, so this is
         also the one subset the browser actually fetches (verified via
         network panel; the other subset files it never requests). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource/libre-franklin/files/libre-franklin-latin-400-normal.woff2"
      crossorigin
    />
    <!-- 700: the header (wordmark, nav, FR/EN) renders at this weight, and
         it is above the fold on every page, so it is worth preloading too. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource/libre-franklin/files/libre-franklin-latin-700-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource/didact-gothic/files/didact-gothic-latin-400-normal.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
