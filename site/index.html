<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Coordinator feedback (task 27): a sensible value before React
         mounts (the dev server, and any build that skips the prerender,
         never had one otherwise). Kept in sync by hand with HOME_TITLE in
         src/lib/pageTitle.js, since a static HTML file can't import a JS
         constant -- prerender/index.js's pageHtml() replaces this with the
         real per-route title on every prerendered page (see
         stripExistingTitle there for why it's a replace, not an append),
         and usePageTitle() does the same at runtime after hydration. -->
    <title>Philippe Gronon</title>
    <!-- Client feedback (task 27): the artist's own PG mark, already copied
         into public/ for the admin nav, is the obvious source for a
         favicon -- no new asset needed. -->
    <link rel="icon" type="image/png" href="/pg-mark.png" />
    <!-- Preloaded so the self-hosted faces are already in cache before the
         CSS that references them is parsed, avoiding a fallback-then-swap
         flash. Only the "latin" subset: French and English text stays inside
         U+0000-00FF/U+0152-0153, which that subset alone covers, so this is
         also the one subset the browser actually fetches (verified via
         network panel; the other subset files it never requests).
         Paths point at public/fonts/, which Vite copies verbatim (no
         filename hashing), so the same URL resolves in dev and in a
         production build; the design/fonts.css @font-face rules point at
         the same files. crossorigin is required even though these are
         same-origin requests, or font preloads are fetched twice. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/libre-franklin-latin-400-normal.woff2"
      crossorigin
    />
    <!-- 700: the header (wordmark, nav, FR/EN) renders at this weight, and
         it is above the fold on every page, so it is worth preloading too. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/libre-franklin-latin-700-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/didact-gothic-latin-400-normal.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
