apiVersion: v1
kind: ConfigMap
metadata:
  name: philippe-api-config
  namespace: apps
# No ALLOWED_ORIGINS here, and none is wanted: the site and its API share an
# origin (Traefik routes /api and /media of the same host to philippe-api, see
# k8s/web.yaml), so the browser never makes a cross-origin request and there is
# nothing for a CORS allowlist to allow. The key used to sit here naming a
# single host, read by nothing in api/src -- which made it worse than useless
# once www.philippegronon.com was added, since it looked like a list that
# needed the new domain adding to it.
data:
  MONGO_DB: "philippe"
  MEDIA_ROOT: "/data/media"
  PORT: "8080"
---
# Media lives on a node-local ReadWriteOnce volume, so this deployment must
# stay at one replica and must not run two pods at once during a rollout.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: philippe-media
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
# Secrets are created out of band -- see docs/deploy.md:
#   kubectl --context dadonew -n apps create secret generic philippe-api-secrets \
#     --from-literal=MONGO_URI='mongodb://mongo.infra.svc.cluster.local:27017' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_EMAIL='...' --from-literal=ADMIN_PASSWORD='...'
#
# No credentials in MONGO_URI: the infra/mongo Deployment runs mongo:7 with no
# --auth flag and no MONGO_INITDB_ROOT_* env, so the server accepts
# unauthenticated in-cluster connections. Adding a <user>:<pass>@ prefix or
# ?authSource=admin would fail. The database name is not in the URI either --
# api/src/db.js passes MONGO_DB (the ConfigMap above) to mongoose as dbName.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: philippe-api
  namespace: apps
  labels: { app: philippe-api }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: philippe-api }
  template:
    metadata:
      labels: { app: philippe-api }
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: philippe-api
          image: ghcr.io/balthazar/philippe-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: philippe-api-config }
            - secretRef: { name: philippe-api-secrets }
          volumeMounts:
            - name: media
              mountPath: /data/media
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 60
            failureThreshold: 3
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: philippe-media
---
apiVersion: v1
kind: Service
metadata:
  name: philippe-api
  namespace: apps
  labels: { app: philippe-api }
spec:
  type: ClusterIP
  selector: { app: philippe-api }
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
