apiVersion: apps/v1
kind: Deployment
metadata:
  name: philippe-web
  namespace: apps
  labels: { app: philippe-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: philippe-web }
  template:
    metadata:
      labels: { app: philippe-web }
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: philippe-web
          image: ghcr.io/balthazar/philippe-web:latest
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: philippe-web
  namespace: apps
  labels: { app: philippe-web }
spec:
  type: ClusterIP
  selector: { app: philippe-web }
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
# TLS terminates at Cloudflare (proxied/orange-cloud record for
# www.philippegronon.com -> 135.148.100.142); Traefik only ever serves plain
# HTTP inside the cluster, which is why there is no tls: block here and no
# cert-manager annotation. Every other ingress in this cluster is set up the
# same way -- see k8s/apps in the server-migration repo.
#
# /api and /media are more specific than /, and Traefik's Ingress provider
# orders rules by path length, so both reach philippe-api before the catch-all
# hits philippe-web. The API mounts its routes under /api and /media itself
# (api/src/app.js), so no prefix stripping is needed.
#
# One host. philippe.balthazar.dev was the staging domain and served the site
# until the cutover; it is gone rather than kept as an alias, because a second
# hostname answering with the same content is a duplicate of the site that can
# be found, linked and indexed. SITE_URL in .github/workflows/deploy-web.yml
# moved here in the same commit -- prerender builds canonical, hreflang, OG and
# sitemap.xml from it, so leaving it behind would have had the live site naming
# a domain that no longer resolves.
#
# The apex (philippegronon.com, no www) is deliberately absent. It is a
# redirect decision rather than a routing one -- one of the two spellings has
# to be canonical, or the site answers on both and splits its own search
# ranking -- and it is handled by a Cloudflare redirect rule that fires at the
# edge, before a request ever reaches this cluster. Pointing the apex here
# instead would just earn Traefik's 404: there is no rule for that host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: philippe
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: www.philippegronon.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: philippe-api, port: { number: 80 } } }
          - path: /media
            pathType: Prefix
            backend: { service: { name: philippe-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: philippe-web, port: { number: 80 } } }
