apiVersion: apps/v1
kind: Deployment
metadata:
  name: philippe-web
  namespace: apps
  labels: { app: philippe-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: philippe-web }
  template:
    metadata:
      labels: { app: philippe-web }
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: philippe-web
          image: ghcr.io/balthazar/philippe-web:latest
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: philippe-web
  namespace: apps
  labels: { app: philippe-web }
spec:
  type: ClusterIP
  selector: { app: philippe-web }
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
# TLS terminates at Cloudflare (proxied/orange-cloud record for
# www.philippegronon.com -> 135.148.100.142); Traefik only ever serves plain
# HTTP inside the cluster, which is why there is no tls: block here and no
# cert-manager annotation. Every other ingress in this cluster is set up the
# same way -- see k8s/apps in the server-migration repo.
#
# /api and /media are more specific than /, and Traefik's Ingress provider
# orders rules by path length, so both reach philippe-api before the catch-all
# hits philippe-web. The API mounts its routes under /api and /media itself
# (api/src/app.js), so no prefix stripping is needed.
#
# Two hosts, the same three rules. An Ingress rule takes one host, so this is
# duplicated rather than shared -- the two blocks have to be edited in step.
#
# www.philippegronon.com is the real site. philippe.balthazar.dev was the
# staging domain, was removed at the cutover, and is back by request as a
# second way in; its Cloudflare record still points here, so the rule is all
# that was missing.
#
# It is an alias, NOT a second site, and one thing keeps it that way: SITE_URL
# in .github/workflows/deploy-web.yml names www.philippegronon.com, and
# prerender builds canonical, hreflang, og:url, sitemap.xml and robots.txt from
# it. So every page served on this host tells a crawler that the real page
# lives on the other one. Point SITE_URL back at the staging domain and that
# stops being true -- the two hostnames become genuine duplicate content
# competing for the same ranking. If this alias is ever meant to be private
# rather than merely secondary, the honest way is Cloudflare Access in front of
# the host, not an Ingress rule that anyone who knows the name can reach.
#
# The apex (philippegronon.com, no www) is deliberately absent. It is a
# redirect decision rather than a routing one -- one of the two spellings has
# to be canonical, or the site answers on both and splits its own search
# ranking -- and it is handled by a Cloudflare redirect rule that fires at the
# edge, before a request ever reaches this cluster. Pointing the apex here
# instead would just earn Traefik's 404: there is no rule for that host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: philippe
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: www.philippegronon.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: philippe-api, port: { number: 80 } } }
          - path: /media
            pathType: Prefix
            backend: { service: { name: philippe-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: philippe-web, port: { number: 80 } } }
    - host: philippe.balthazar.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: philippe-api, port: { number: 80 } } }
          - path: /media
            pathType: Prefix
            backend: { service: { name: philippe-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: philippe-web, port: { number: 80 } } }
