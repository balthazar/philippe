worker_processes 1;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/javascript image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Fingerprinted static assets outside /assets/ (fonts served from
    # public/, copied verbatim by Vite with no hash in the filename, so they
    # are still safe to cache long since site/index.html references them by
    # a fixed path).
    location ~* \.(?:woff2|ico|png|jpg|jpeg|webp|svg)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # Prerendered routes ship as <route>/index.html (see prerender/index.js);
    # anything without a matching file (the admin SPA's client-side routes,
    # any route the prerender didn't emit) falls through to the SPA shell.
    # /api and /media never reach this container: the Ingress routes both
    # straight to the API service.
    location / {
      try_files $uri $uri/index.html /index.html;
    }

    # Never cache the HTML entrypoints: they change on every deploy.
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /admin/index.html { add_header Cache-Control "no-store"; }
  }
}
